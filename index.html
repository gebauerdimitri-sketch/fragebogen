<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="robots" content="noindex">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Gebauer Fragebogen</title>
<meta name="theme-color" content="#2d5f5a">
<style>
:root{
  --ground:#edf1ef; --surface:#ffffff; --surface-2:#f5f8f7; --line:#d5dedb;
  --ink:#1b2a29; --ink-2:#4d5e5b; --ink-3:#778784;
  --accent:#2d5f5a; --accent-ink:#ffffff; --accent-soft:#dbe9e6;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#7a4bbf;
  --band1:rgba(120,140,135,.05); --band2:rgba(120,140,135,.10); --band3:rgba(120,140,135,.17);
  --band4:rgba(120,140,135,.25); --band5:rgba(120,140,135,.34);
  --ok-bg:#e3f0e6; --ok-ink:#23583a; --warn-bg:#fbefd6; --warn-ink:#7a4d00;
  --serious-bg:#fbe3d6; --serious-ink:#8a3a12; --crit-bg:#fadcdc; --crit-ink:#9b1c1c; --crit:#c62828;
  --brand:#17393a;
  --radius:14px;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#111716; --surface:#19211f; --surface-2:#1f2826; --line:#2f3b39;
    --ink:#e5eeec; --ink-2:#aebdba; --ink-3:#83938f;
    --accent:#7fb8b0; --accent-ink:#0f1a18; --accent-soft:#233532; --brand:#cfe3df;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
    --band1:rgba(170,190,185,.03); --band2:rgba(170,190,185,.07); --band3:rgba(170,190,185,.12);
    --band4:rgba(170,190,185,.18); --band5:rgba(170,190,185,.25);
    --ok-bg:#1d3326; --ok-ink:#9fd6b0; --warn-bg:#3a2e12; --warn-ink:#f0c46a;
    --serious-bg:#3d2417; --serious-ink:#f3a57c; --crit-bg:#431c1c; --crit-ink:#ff9b9b; --crit:#ef5350;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#111716; --surface:#19211f; --surface-2:#1f2826; --line:#2f3b39;
  --ink:#e5eeec; --ink-2:#aebdba; --ink-3:#83938f;
  --accent:#7fb8b0; --accent-ink:#0f1a18; --accent-soft:#233532; --brand:#cfe3df;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#9085e9;
  --band1:rgba(170,190,185,.03); --band2:rgba(170,190,185,.07); --band3:rgba(170,190,185,.12);
  --band4:rgba(170,190,185,.18); --band5:rgba(170,190,185,.25);
  --ok-bg:#1d3326; --ok-ink:#9fd6b0; --warn-bg:#3a2e12; --warn-ink:#f0c46a;
  --serious-bg:#3d2417; --serious-ink:#f3a57c; --crit-bg:#431c1c; --crit-ink:#ff9b9b; --crit:#ef5350;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;
  padding-inline:16px;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:700}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem 1rem;min-height:44px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.danger{color:var(--crit-ink)}
.btn:disabled{opacity:.45;cursor:default}
.field{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .8rem;min-height:44px}

/* ---------- Klientenmodus ---------- */
.kiosk{min-height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding-block:20px 28px}
.kiosk-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:1.25rem;letter-spacing:.02em;color:var(--brand)}
.logo{width:44px;height:44px;color:var(--brand);flex:none}
.kiosk-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px;padding-block:24px}
.welcome h1{font-size:clamp(2rem,5vw,2.8rem)}
.welcome p{font-size:1.15rem;max-width:34em}
.code-row{display:flex;gap:12px;flex-wrap:wrap}
.code-input{flex:1 1 220px;font-size:2rem;letter-spacing:.18em;text-transform:uppercase;font-family:var(--mono);
  padding:.5rem 1rem;border:2px solid var(--line);border-radius:var(--radius);background:var(--surface);min-height:72px}
.code-input:focus{border-color:var(--accent);outline:none}
.big{font-size:1.25rem;padding:.9rem 1.6rem;min-height:72px;border-radius:var(--radius)}
.msg{min-height:1.6em;color:var(--crit-ink);font-weight:700}

.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.done{background:var(--accent)}
.progress i.gap{flex:0 0 10px;background:transparent}
.q-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.q-stem{font-size:1.05rem;color:var(--ink-2)}
.q-text{font-size:clamp(1.55rem,3.6vw,2.15rem);font-weight:700;max-width:30em}
.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.answers{grid-template-columns:1fr}}
.answer{display:flex;align-items:center;gap:14px;text-align:left;padding:1rem 1.1rem;min-height:84px;border-radius:var(--radius);
  border:2px solid var(--line);background:var(--surface);font-size:1.2rem;transition:border-color .12s,background .12s}
.answer:hover{border-color:var(--ink-3)}
.answer .dot{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid var(--ink-3);display:grid;place-items:center}
.answer[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.answer[aria-pressed="true"] .dot{border-color:var(--accent);background:var(--accent)}
.answer[aria-pressed="true"] .dot::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent-ink)}
.q-nav{display:flex;justify-content:space-between;gap:12px}
.thanks{text-align:center;align-items:center}
.thanks .check{width:88px;height:88px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.thanks h1{font-size:clamp(2rem,5vw,2.6rem)}
.thanks p{font-size:1.2rem;max-width:30em;margin:0}

/* ---------- Praxisbereich ---------- */
.praxis{max-width:1180px;margin:0 auto;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:1.35rem}
.tabs{display:flex;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px}
.tabs button{border:0;background:transparent;border-radius:8px;padding:.45rem .9rem;min-height:40px;color:var(--ink-2)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.layout{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.side{display:flex;flex-direction:column}
.side-head{padding:14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.add-row{display:flex;gap:8px}
.add-row input{flex:1;min-width:0;text-transform:uppercase;font-family:var(--mono)}
.clist{list-style:none;margin:0;padding:6px;max-height:70vh;overflow:auto}
.clist button{width:100%;border:0;background:transparent;text-align:left;border-radius:10px;padding:10px;display:grid;
  grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.clist button:hover{background:var(--surface-2)}
.clist button[aria-current="true"]{background:var(--accent-soft)}
.clist .code{font-family:var(--mono);font-weight:500;font-size:1.05rem}
.clist .sub{grid-column:1/-1;font-size:.82rem;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.empty{padding:24px;color:var(--ink-2)}
.detail{padding:20px;display:flex;flex-direction:column;gap:22px}
.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.detail-head h2{font-family:var(--mono);font-weight:500;font-size:1.9rem;letter-spacing:.06em}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--mono);font-size:1.9rem;line-height:1.1}
.stat .v small{font-size:.9rem;color:var(--ink-3)}
.stat .d{font-size:.85rem;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:.8rem;font-weight:700;white-space:nowrap}
.sev0{background:var(--ok-bg);color:var(--ok-ink)}
.sev1{background:var(--ok-bg);color:var(--ok-ink)}
.sev2{background:var(--warn-bg);color:var(--warn-ink)}
.sev3{background:var(--serious-bg);color:var(--serious-ink)}
.sev4{background:var(--crit-bg);color:var(--crit-ink)}
.flag{background:var(--crit-bg);color:var(--crit-ink)}
.sev-none{background:var(--surface-2);color:var(--ink-3);font-weight:400}
.flag::before{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--crit);color:#fff;font-size:.7rem}
.alert{border:1px solid var(--crit);background:var(--crit-bg);color:var(--crit-ink);border-radius:12px;padding:12px 14px}
.demo-note{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:10px 14px;font-size:.9rem}
.charts{display:grid;grid-template-columns:1fr;gap:28px}
.chart h3{font-size:1.2rem;display:flex;align-items:center;gap:8px}
.chart h3 .sw{width:14px;height:3px;border-radius:2px}
.chart p{margin:2px 0 6px;font-size:.85rem;color:var(--ink-3)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart svg text{fill:var(--ink-2);font-family:var(--font);font-size:14px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .band-label{fill:var(--ink-2);font-size:13px}
.chart .hit{fill:transparent;cursor:pointer}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;font-size:.85rem;box-shadow:0 6px 20px rgba(0,0,0,.14);max-width:240px}
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.items{font-family:var(--mono);font-size:.82rem;color:var(--ink-2)}
.settings{padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.settings section{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:12px;padding:16px}
.settings h3{font-size:1.05rem}
.settings p{margin:0;font-size:.92rem;color:var(--ink-2)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);
  padding:10px 16px;border-radius:10px;font-weight:700;z-index:20}
.pin-card{max-width:380px;margin:12vh auto 0;padding:24px;display:flex;flex-direction:column;gap:14px}
.pin-card input{font-family:var(--mono);font-size:1.6rem;letter-spacing:.3em;text-align:center}
.show{max-width:1100px;margin:0 auto;padding-block:20px 40px;display:flex;flex-direction:column;gap:28px}
.show .chart h3{font-size:clamp(1.4rem,3vw,1.9rem)}
.show .chart p{font-size:1rem}
.show .chart svg text{font-size:15px}
.show .chart .band-label{font-size:14px}
.show-now{display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:1.1rem}
.show-now .num{font-size:2rem;color:var(--ink)}
.show .chip{font-size:1rem;padding:2px 12px}
.pe{padding:20px;display:flex;flex-direction:column;gap:20px}
.pe-top{display:flex;gap:16px;flex-wrap:wrap;align-items:end}
.pe-top label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--ink-2)}
.pe-sec{display:flex;flex-direction:column;gap:2px}
.pe-sec h3{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:1.1rem;padding-bottom:6px;border-bottom:1px solid var(--line)}
.pe-row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pe-row .n{font-family:var(--mono);color:var(--ink-3)}
.pe-row .t{font-size:.95rem}
.seg{display:flex;gap:4px}
.seg button{width:48px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:var(--mono);font-size:1.05rem}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pe-row.missing{background:var(--crit-bg);border-radius:8px}
.pe-row.missing .n{color:var(--crit-ink);font-weight:700}
@media (max-width:560px){.pe-row{grid-template-columns:24px minmax(0,1fr)}.pe-row .seg{grid-column:2}}
.legend-scale{font-size:.85rem;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 14px;min-height:40px;font-size:.9rem;background:var(--surface);cursor:pointer}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.checks input{width:18px;height:18px;accent-color:var(--accent)}
.instr-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.instr-head h4{margin:0;font-size:1rem}
.scale-note{font-size:.85rem;color:var(--ink-3);margin:0}
.pill-row{display:flex;gap:6px;flex-wrap:wrap}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem .7rem;min-height:44px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
</style>

</head>
<body>
<div id="app"></div>
<div id="tip" class="tip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
/* ================= Antwortskalen ================= */
const OPT_PHQ = ["Überhaupt nicht","An einzelnen Tagen","An mehr als der Hälfte der Tage","Beinahe jeden Tag"];
const OPT_WHO = ["Zu keinem Zeitpunkt","Ab und zu","Etwas weniger als die Hälfte der Zeit","Etwas mehr als die Hälfte der Zeit","Meistens","Die ganze Zeit"];
const OPT_SSS = ["Überhaupt nicht","Kaum","Etwas","Ziemlich","Sehr"];
const OPT_SBA = ["Trifft nicht zu","Trifft etwas zu","Trifft überwiegend zu","Trifft voll und ganz zu"];
const OPT_SBB = ["Nie","Selten","Manchmal (etwa in der Hälfte solcher Situationen)","Häufig","Fast immer"];
const OPT_SBC = ["Macht mir keine Angst","Macht mir leichte Angst","Macht mir mäßige Angst","Macht mir starke Angst","Macht mir sehr starke Angst"];
const OPT_DASS = ["Traf gar nicht auf mich zu","Traf bis zu einem gewissen Grad auf mich zu","Traf in beträchtlichem Maße auf mich zu","Traf sehr stark auf mich zu"];

/* ================= Fragebögen ================= */
const INSTR = {
  phq9:{
    name:"PHQ-9", subtitle:"Depression", options:OPT_PHQ,
    stem:"Wie oft fühlten Sie sich im Verlauf der letzten 2 Wochen durch die folgenden Beschwerden beeinträchtigt?",
    items:[
      "Wenig Interesse oder Freude an Ihren Tätigkeiten",
      "Niedergeschlagenheit, Schwermut oder Hoffnungslosigkeit",
      "Schwierigkeiten, ein- oder durchzuschlafen, oder vermehrter Schlaf",
      "Müdigkeit oder Gefühl, keine Energie zu haben",
      "Verminderter Appetit oder übermäßiges Bedürfnis zu essen",
      "Schlechte Meinung von sich selbst; Gefühl, ein Versager zu sein oder die Familie enttäuscht zu haben",
      "Schwierigkeiten, sich auf etwas zu konzentrieren, z. B. beim Zeitunglesen oder Fernsehen",
      "Waren Ihre Bewegungen oder Ihre Sprache so verlangsamt, dass es auch anderen auffallen würde? Oder waren Sie im Gegenteil „zappelig“ oder ruhelos und hatten dadurch einen stärkeren Bewegungsdrang als sonst?",
      "Gedanken, dass Sie lieber tot wären oder sich Leid zufügen möchten"
    ],
    flag:{item:8,label:"Frage 9",text:"Frage 9 (Suizidgedanken)"},
    scales:[{key:"phq9",name:"PHQ-9",axis:"Summenwert 0–27",max:27,better:"low",
      bands:[[0,4,"minimal"],[5,9,"leicht"],[10,14,"mittelgradig"],[15,19,"mittelschwer"],[20,27,"schwer"]],
      calc:a=>a.reduce((s,x)=>s+x,0)}]
  },
  gad7:{
    name:"GAD-7", subtitle:"Angst", options:OPT_PHQ,
    stem:"Wie oft fühlten Sie sich im Verlauf der letzten 2 Wochen durch die folgenden Beschwerden beeinträchtigt?",
    items:[
      "Nervosität, Ängstlichkeit oder Anspannung",
      "Nicht in der Lage sein, Sorgen zu stoppen oder zu kontrollieren",
      "Übermäßige Sorgen bezüglich verschiedener Angelegenheiten",
      "Schwierigkeiten zu entspannen",
      "Rastlosigkeit, sodass Stillsitzen schwerfällt",
      "Schnelle Verärgerung oder Gereiztheit",
      "Gefühl der Angst, so als würde etwas Schlimmes passieren"
    ],
    scales:[{key:"gad7",name:"GAD-7",axis:"Summenwert 0–21",max:21,better:"low",
      bands:[[0,4,"minimal"],[5,9,"leicht"],[10,14,"mittelgradig"],[15,21,"schwer"]],
      calc:a=>a.reduce((s,x)=>s+x,0)}]
  },
  who5:{
    name:"WHO-5", subtitle:"Wohlbefinden", options:OPT_WHO,
    stem:"Bitte geben Sie für jede der fünf Aussagen an, was für Ihr Befinden während der letzten zwei Wochen am ehesten zutrifft.",
    items:[
      "In den letzten zwei Wochen war ich froh und guter Laune",
      "In den letzten zwei Wochen habe ich mich ruhig und entspannt gefühlt",
      "In den letzten zwei Wochen habe ich mich energisch und aktiv gefühlt",
      "In den letzten zwei Wochen habe ich mich beim Aufwachen frisch und ausgeruht gefühlt",
      "In den letzten zwei Wochen war mein Alltag voller Dinge, die mich interessieren"
    ],
    note:"Höhere Werte bedeuten mehr Wohlbefinden.",
    scales:[{key:"who5",name:"WHO-5",axis:"Prozentwert 0–100",max:100,better:"high",
      bands:[[0,28,"sehr gering"],[29,50,"gering"],[51,100,"unauffällig"]],
      calc:a=>a.reduce((s,x)=>s+x,0)*4}]
  },
  sss8:{
    name:"SSS-8", subtitle:"Körperbeschwerden", options:OPT_SSS,
    stem:"Wie stark fühlten Sie sich während der letzten 7 Tage durch die folgenden Beschwerden beeinträchtigt?",
    items:[
      "Magen- oder Darmbeschwerden",
      "Rücken- oder Kreuzschmerzen",
      "Schmerzen in Armen, Beinen oder Gelenken",
      "Kopfschmerzen",
      "Schmerzen im Brustbereich oder Kurzatmigkeit",
      "Schwindel",
      "Müdigkeit oder Gefühl, keine Energie zu haben",
      "Schlafprobleme"
    ],
    scales:[{key:"sss8",name:"SSS-8",axis:"Summenwert 0–32",max:32,better:"low",
      bands:[[0,3,"keine bis minimal"],[4,7,"gering"],[8,11,"mittel"],[12,15,"hoch"],[16,32,"sehr hoch"]],
      calc:a=>a.reduce((s,x)=>s+x,0)}]

function sevIndex(sc,v){for(let i=0;i<sc.bands.length;i++) if(v<=sc.bands[i][1]) return i; return sc.bands.length-1}
function sevChip(sc,v){
  if(!sc.bands) return '<span class="chip sev-none">nicht normiert</span>';
  const i=sevIndex(sc,v), label=sc.bands[i][2];
  const n=sc.bands.length;
  let rank = sc.better==="high" ? (n-1-i) : i;           // 0 = günstig
  const cls = ["sev0","sev2","sev3","sev4","sev4"][Math.min(rank* (n<=3?2:1),4)];
  return `<span class="chip ${cls}">${label}</span>`;
}

}).filter(Boolean);

async function hash(pin){
  const txt="phqgad:"+pin;
  try{
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(txt));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){let h=5381;for(const c of txt)h=(h*33)^c.charCodeAt(0);return "d"+(h>>>0).toString(16)}
}

function renderClients(){
  const body=document.getElementById("body");
  const codes=Object.keys(store.clients).sort();
  if(!selected||!store.clients[selected]) selected=codes[0]||null;
  const items=codes.map(c=>{

    let sub="<span>noch keine Antworten</span>";
    if(last){
      const parts=usedScales([last]).slice(0,3).map(sc=>`${sc.name.replace("DASS ","")} ${scoreOf(last,sc.key)}`);
      sub=`<span>${fmtDate(last.ts)}</span><span class="num">${parts.join(" · ")}</span>${flagged(last)?'<span class="chip flag">Item 9</span>':""}`;
    }

/* ================= Diagramm ================= */
function drawChart(host,entries,sc,opt={}){
  if(!host)return;
  const es=entries.filter(e=>scoreOf(e,sc.key)!==null);
  const max=sc.max, lo=sc.min||0, bands=sc.bands, n=es.length;
  const W=900,H=opt.big?380:320,L=44,R=124,T=14,B=36;
  const pw=W-L-R, ph=H-T-B;
  const y=v=>T+ph-((v-lo)/(max-lo))*ph;
  const x=i=>n===1?L+pw/2:L+(i/(n-1))*pw;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${sc.name} Verlauf, ${n} Messungen">`;
  const nb=bands?bands.length:0;
  (bands||[]).forEach((b,i)=>{
    const top=i===nb-1?max:b[1]+.5, bot=i===0?lo:b[0]-.5;
    const rank = sc.better==="high" ? (nb-1-i) : i;
    const tint = Math.min(5, Math.max(1, Math.round(1 + rank*(4/Math.max(1,nb-1)))));
    s+=`<rect x="${L}" y="${y(top)}" width="${pw}" height="${y(bot)-y(top)}" fill="var(--band${tint})"/>`;
    s+=`<text class="band-label" x="${L+pw+8}" y="${(y(top)+y(bot))/2+4}">${b[2]}</text>`;
  });
  const ticks = bands ? [lo,...bands.slice(1).map(b=>b[0]),max]
    : Array.from({length:5},(_,i)=>Math.round(lo+(max-lo)*i/4));
  if(!bands) s+=`<rect x="${L}" y="${T}" width="${pw}" height="${ph}" fill="var(--band1)"/>`;
  ticks.forEach(t=>{s+=`<line class="grid" x1="${L}" x2="${L+pw}" y1="${y(t)}" y2="${y(t)}" stroke-dasharray="${t===0?"":"2 4"}"/><text x="${L-8}" y="${y(t)+5}" text-anchor="end">${t}</text>`});
  const every=Math.ceil(n/7);
  es.forEach((e,i)=>{ if(i%every===0||i===n-1) s+=`<text x="${x(i)}" y="${H-10}" text-anchor="middle">${fmtShort(e.ts)}</text>`; });
  const pts=es.map((e,i)=>[x(i),y(scoreOf(e,sc.key))]);
  if(n>1) s+=`<path d="${pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("")}" fill="none" stroke="${sc.color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p,i)=>{
    const lastPt=i===n-1;
    s+=`<circle cx="${p[0]}" cy="${p[1]}" r="${lastPt?7:5}" fill="${lastPt?sc.color:"var(--surface)"}" stroke="${lastPt?"var(--surface)":sc.color}" stroke-width="2"/>`;
    if(!opt.clean&&INSTR[sc.instr].flag&&flagsIn(es[i]).some(f=>f.instr===sc.instr)) s+=`<circle cx="${p[0]}" cy="${p[1]}" r="11" fill="none" stroke="var(--crit)" stroke-width="1.5" stroke-dasharray="3 2"/>`;
  });
  const lp=pts[n-1];
  s+=`<text x="${lp[0]}" y="${lp[1]-14}" text-anchor="${n===1?"middle":"end"}" style="fill:var(--ink);font-weight:700;font-size:17px">${scoreOf(es[n-1],sc.key)}</text>`;
  const hw=n>1?pw/(n-1):pw;
  pts.forEach((p,i)=>{s+=`<rect class="hit" data-i="${i}" x="${p[0]-hw/2}" y="${T}" width="${hw}" height="${ph}" fill="transparent"/>`});
  s+=`</svg>`;
  host.innerHTML=s;
  host.querySelectorAll(".hit").forEach(r=>{
    const show=ev=>{
      const e=es[+r.dataset.i], v=scoreOf(e,sc.key);
      showTip(ev,`<strong>${fmtDate(e.ts)}</strong><br>${sc.name}: <span class="num">${v}</span> ${sevChip(sc,v)}${!opt.clean?flagsIn(e).filter(f=>f.instr===sc.instr).map(f=>`<br><span class="chip flag">${f.label}: ${f.answer}</span>`).join(""):""}`);
    };
    r.addEventListener("pointerenter",show);r.addEventListener("pointermove",show);r.addEventListener("pointerdown",show);
    r.addEventListener("pointerleave",hideTip);
  });
}

const downloads={save:async({filename,data})=>{

  const url=URL.createObjectURL(new Blob([data],{type}));
  const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);return {status:"saved"};
}};

function csv(){
  const head=["Kuerzel","Datum","Uhrzeit","Quelle","Fragebogen","Skala","Wert","Maximum","Einstufung","Einzelantworten"];
  const rows=[];
  store.entries.slice().sort((a,b)=>a.code.localeCompare(b.code)||a.ts-b.ts).forEach(e=>{
    KEYS.forEach(k=>{
      const a=e.a&&e.a[k];
      if(!valid(k,a))return;
      INSTR[k].scales.forEach(sc=>{
        const v=sc.calc(a);
        rows.push([e.code,fmtDate(e.ts),fmtTime(e.ts),e.src==="paper"?"Papier":"Tablet",INSTR[k].name,sc.name,v,sc.max,sc.bands[sevIndex(sc,v)][2],a.join(" ")]);

    });
  });
  return "﻿"+[head,...rows].map(r=>r.join(";")).join("\r\n");
}

}

      <p><strong>PHQ-9</strong> (0–27): 0–4 minimal · 5–9 leicht · 10–14 mittelgradig · 15–19 mittelschwer · 20–27 schwer. Frage 9 wird bei jedem Wert über 0 markiert.</p>
      <p><strong>GAD-7</strong> (0–21): 0–4 minimal · 5–9 leicht · 10–14 mittelgradig · 15–21 schwer.</p>
      <p><strong>WHO-5</strong> (0–100, Rohwert × 4): 51–100 unauffällig · 29–50 gering, weitere Abklärung sinnvoll · 0–28 sehr gering. Höhere Werte bedeuten mehr Wohlbefinden.</p>
      <p><strong>SSS-8</strong> (0–32): 0–3 keine bis minimal · 4–7 gering · 8–11 mittel · 12–15 hoch · 16–32 sehr hoch.</p>
      <p><strong>DASS-21</strong> (je 0–21): auffällig ab 10 (Depression), ab 6 (Angst), ab 10 (Stress).</p>
      <p><strong>Depressionsinventar</strong> (0–63): 0–8 keine · 9–14 minimale · 15–19 leichte · 20–29 mittelgradige · ab 30 schwere Depression. Aussage 13 (Suizidgedanken) wird wie PHQ-9 Frage 9 markiert.</p>
      <p><strong>Angstgedanken (B)</strong> (0–56) und <strong>Körperempfindungen (C)</strong> (0–68): 0–8 keine · 9–14 minimale · 15–19 leichte · 20–29 mittelgradige · ab 30 schwere Angst. Gezählt wird ab 0, die niedrigste Antwort („nie“ bzw. „macht mir keine Angst“) zählt 0 Punkte. Auf dem Papierbogen steht dafür eine 1, der Summenwert liegt daher um 14 (B) bzw. 17 (C) Punkte niedriger als beim Zusammenzählen auf Papier.</p>
      <p class="muted" style="font-size:.85rem">Depressionsinventar sowie die Bögen B und C sind eigene, nicht validierte Fassungen. Die Einstufungen sind praxisintern festgelegt und beruhen nicht auf einer Normierungsstichprobe.</p>
      <p>Die Werte sind Screening-Hinweise und ersetzen keine Diagnose.</p>
      <p class="muted" style="font-size:.8rem">${INSTR.dass21.credit}</p>
    </section>
  </div>`;
  const bk=()=>JSON.stringify({app:"phqgad",version:2,exported:new Date().toISOString(),clients:store.clients,entries:store.entries},null,1);
  document.getElementById("bkText").value=bk();
  document.getElementById("expJson").onclick=()=>offer(`fragebogen-sicherung-${stamp()}.json`,bk());
  document.getElementById("expCsv").onclick=()=>offer(`fragebogen-auswertung-${stamp()}.csv`,csv());
  document.getElementById("copyBk").onclick=async()=>{
    const ta=document.getElementById("bkText");
    try{await navigator.clipboard.writeText(ta.value);toast("Kopiert")}catch(e){ta.select();toast("Text markiert – jetzt kopieren")}
  };
  const doImport=txt=>{
    try{
      const d=JSON.parse(txt);
      if(!d||d.app!=="phqgad"||!Array.isArray(d.entries))throw 0;
      const ids=new Set(store.entries.map(e=>e.id));let added=0;
      Object.keys(d.clients||{}).forEach(c=>{if(!store.clients[c])store.clients[c]=d.clients[c]});
      d.entries.forEach(e=>{
        if(ids.has(e.id))return;
        if(!e.a){e.a={}; if(e.phq)e.a.phq9=e.phq; if(e.gad)e.a.gad7=e.gad; delete e.phq; delete e.gad;}
        if(!Object.keys(e.a).some(k=>valid(k,e.a[k])))return;
        if(!store.clients[e.code])store.clients[e.code]={created:e.ts,tests:["phq9","gad7"]};
        store.entries.push(e);added++;
      });
      migrate();save();toast(`${added} Befragung(en) übernommen`);renderSettings();
    }catch(e){toast("Das ist keine gültige Sicherungsdatei.")}
  };
  document.getElementById("impFile").onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f)};
  document.getElementById("impGo").onclick=()=>doImport(document.getElementById("impText").value);
  document.getElementById("pinChange").onsubmit=async e=>{
    e.preventDefault();
    const o=document.getElementById("pinOld").value,nw=document.getElementById("pinNew").value;
    if(await hash(o)!==store.pinHash){toast("Alte PIN stimmt nicht");return}
    if(!/^\d{4,}$/.test(nw)){toast("Neue PIN: mindestens 4 Ziffern");return}
    store.pinHash=await hash(nw);save();toast("PIN geändert");e.target.reset();
  };
}

load();
render();
if("serviceWorker" in navigator&&location.protocol==="https:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}
})();
</script>
